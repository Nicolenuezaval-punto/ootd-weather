<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OOTD Weather</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f7;color:#1a1a1a;min-height:100vh}
    .app{max-width:430px;margin:0 auto;padding:1.25rem 1rem 4rem}

    /* SEARCH */
    .search-bar{display:flex;gap:8px;margin-bottom:1.25rem}
    .search-bar input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid #ddd;background:#fff;font-size:14px;color:#1a1a1a;outline:none}
    .search-bar input:focus{border-color:#1a6fa8}
    .search-bar button{padding:11px 13px;border-radius:12px;border:1px solid #ddd;background:#fff;font-size:13px;font-weight:500;color:#1a1a1a;cursor:pointer}
    .search-bar button:hover{background:#f0f0f0}

    /* WEATHER CARD */
    .weather-card{border-radius:22px;padding:1.4rem;margin-bottom:1rem;color:#fff}
    .wc-top{display:flex;align-items:flex-start;justify-content:space-between}
    .wc-city{font-size:15px;font-weight:600;opacity:.92}
    .wc-date{font-size:12px;opacity:.65;margin-top:2px}
    .wc-icon{font-size:46px;line-height:1}
    .wc-mid{display:flex;align-items:flex-end;gap:6px;margin-top:.8rem}
    .wc-temp{font-size:64px;font-weight:200;line-height:1;letter-spacing:-2px}
    .wc-unit{font-size:24px;font-weight:300;align-self:flex-start;margin-top:14px}
    .wc-cond{font-size:15px;opacity:.88;margin-top:5px}
    .wc-feels{font-size:12px;opacity:.62;margin-top:2px}
    .wc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.22)}
    .wc-stat{text-align:center}
    .wc-stat-v{font-size:13px;font-weight:500}
    .wc-stat-l{font-size:11px;opacity:.65;margin-top:2px}

    /* ALERTS */
    .alert{display:flex;align-items:flex-start;gap:10px;background:#fff8e6;border:1px solid #f0c040;border-radius:12px;padding:11px 12px;margin-bottom:8px}
    .alert-ico{font-size:16px;flex-shrink:0}
    .alert-txt{font-size:13px;color:#7a5500;line-height:1.45;font-weight:500}

    /* SECTION */
    .section-label{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin:1.5rem 0 .75rem}

    /* HOURLY */
    .hourly-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:1rem;scrollbar-width:none}
    .hourly-scroll::-webkit-scrollbar{display:none}
    .hour-card{flex-shrink:0;background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:12px 10px;text-align:center;min-width:64px}
    .hour-card.now{background:#1a6fa8;border-color:#1a6fa8}
    .hour-time{font-size:12px;font-weight:500;color:#888}
    .hour-card.now .hour-time{color:rgba(255,255,255,.8)}
    .hour-icon{font-size:22px;margin:6px 0}
    .hour-temp{font-size:15px;font-weight:600;color:#1a1a1a}
    .hour-card.now .hour-temp{color:#fff}
    .hour-rain{font-size:11px;color:#1a6fa8;margin-top:3px}
    .hour-card.now .hour-rain{color:rgba(255,255,255,.8)}

    /* OUTFIT */
    .style-pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:1rem}
    .pill{padding:7px 16px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:13px;font-weight:500;color:#555;cursor:pointer;transition:all .15s}
    .pill.active{background:#1a6fa8;color:#fff;border-color:#1a6fa8}
    .outfit-card{background:#fff;border:1px solid #e8e8e8;border-radius:18px;padding:1.25rem;margin-bottom:1rem}
    .outfit-frase{font-size:15px;font-weight:600;color:#1a1a1a;line-height:1.5;margin-bottom:1rem}
    .outfit-items{display:flex;flex-direction:column;gap:9px}
    .outfit-item{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;background:#f7f7f9;border-radius:13px}
    .oi-ph{width:44px;height:44px;border-radius:10px;background:#ebebef;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid #e0e0e0}
    .oi-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid #e0e0e0}
    .oi-name{font-size:14px;font-weight:600;color:#1a1a1a}
    .oi-why{font-size:12px;color:#666;margin-top:2px;line-height:1.4}
    .oi-badge{display:inline-block;font-size:11px;background:#e6f4ea;color:#2e7d32;border-radius:6px;padding:1px 7px;margin-top:5px;font-weight:600}

    /* 7 DAYS */
    .day-card{background:#fff;border:1px solid #e8e8e8;border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .15s}
    .day-card:hover{border-color:#1a6fa8}
    .day-card-top{display:flex;align-items:center;gap:12px}
    .day-name{font-size:14px;font-weight:600;color:#1a1a1a;width:70px;flex-shrink:0}
    .day-icon{font-size:22px;flex-shrink:0}
    .day-cond{font-size:12px;color:#888;flex:1}
    .day-temps{display:flex;gap:6px;align-items:center;flex-shrink:0}
    .day-max{font-size:15px;font-weight:600;color:#1a1a1a}
    .day-min{font-size:13px;color:#aaa}
    .day-rain-badge{font-size:11px;color:#1a6fa8;background:#e8f4ff;border-radius:8px;padding:2px 7px}
    .day-outfit-area{margin-top:12px;padding-top:12px;border-top:1px solid #f0f0f0;display:none}
    .day-card.open .day-outfit-area{display:block}
    .day-style-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .day-pill{padding:5px 13px;border-radius:20px;border:1px solid #ddd;background:#f7f7f9;font-size:12px;font-weight:500;color:#555;cursor:pointer}
    .day-pill.active{background:#1a6fa8;color:#fff;border-color:#1a6fa8}

    /* CLOSET */
    .closet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1rem}
    .closet-item{border:1px solid #e8e8e8;border-radius:14px;overflow:hidden;background:#fff}
    .closet-img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
    .closet-ph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:32px;background:#f5f5f7}
    .closet-info{padding:8px}
    .closet-name{font-size:13px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .closet-type{font-size:11px;color:#888;margin-top:1px}
    .closet-del{display:block;width:100%;padding:6px;border:none;background:none;font-size:11px;color:#e53935;cursor:pointer;border-top:1px solid #f0f0f0;text-align:center}
    .upload-zone{border:2px dashed #ccc;border-radius:16px;padding:1.5rem;text-align:center;cursor:pointer;margin-bottom:1rem;transition:all .15s}
    .upload-zone:hover{border-color:#1a6fa8;background:#f0f7ff}
    .upload-zone input{display:none}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:1rem}
    .modal{background:#fff;border-radius:20px 20px 16px 16px;padding:1.5rem;width:100%;max-width:430px}
    .modal-title{font-size:17px;font-weight:700;color:#1a1a1a;margin-bottom:1rem}
    .modal-img{width:100%;max-height:180px;object-fit:contain;border-radius:12px;margin-bottom:1rem;border:1px solid #eee}
    .modal-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
    .modal-row.full{grid-template-columns:1fr}
    .modal-row select,.modal-row input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #ddd;background:#f7f7f9;color:#1a1a1a;font-size:14px;outline:none}
    .modal-actions{display:flex;gap:8px;margin-top:14px}
    .btn-save{flex:1;padding:12px;background:#1a6fa8;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
    .btn-cancel{padding:12px 18px;border:1px solid #ddd;border-radius:12px;background:transparent;font-size:15px;color:#555;cursor:pointer}

    /* MISC */
    .loading-box{text-align:center;padding:1.5rem;color:#888;font-size:14px}
    .spinner{display:inline-block;width:22px;height:22px;border:2px solid #ddd;border-top-color:#1a6fa8;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-state{text-align:center;padding:2rem;color:#888}
    .empty-icon{font-size:42px;margin-bottom:.75rem}
    .empty-title{font-size:16px;font-weight:600;color:#1a1a1a;margin-bottom:5px}
    .empty-sub{font-size:13px;line-height:1.5}
    .divider{height:1px;background:#e8e8e8;margin:1.5rem 0}

    @media(prefers-color-scheme:dark){
      body{background:#1c1c1e;color:#f2f2f7}
      .search-bar input,.search-bar button{background:#2c2c2e;border-color:#3a3a3c;color:#f2f2f7}
      .pill{background:#2c2c2e;border-color:#3a3a3c;color:#aaa}
      .pill.active,.day-pill.active{background:#1a6fa8;color:#fff}
      .outfit-card,.hour-card,.day-card,.closet-item{background:#2c2c2e;border-color:#3a3a3c}
      .outfit-frase,.day-name,.hour-temp,.day-max,.oi-name,.closet-name,.empty-title{color:#f2f2f7}
      .outfit-item{background:#3a3a3c}
      .oi-ph{background:#48484a;border-color:#3a3a3c}
      .oi-why,.hour-time,.day-cond,.day-min,.closet-type{color:#aaa}
      .closet-ph{background:#3a3a3c}
      .upload-zone{border-color:#3a3a3c}
      .modal{background:#2c2c2e}
      .modal-title{color:#f2f2f7}
      .modal-row select,.modal-row input{background:#3a3a3c;border-color:#48484a;color:#f2f2f7}
      .alert{background:#2d2200;border-color:#7a5500}
      .day-outfit-area{border-color:#3a3a3c}
      .day-pill{background:#3a3a3c;border-color:#48484a;color:#aaa}
      .divider{background:#3a3a3c}
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="loading-box"><span class="spinner"></span>Detectando tu ubicación...</div>
</div>
<div id="modal-area"></div>

<script>
const styleLabels={casual:'Casual',formal:'Formal',deportivo:'Deportivo',playa:'Playa'};
const tipoEmoji={camiseta:'👕',camisa:'👔',blusa:'👚',pantalon:'👖',shorts:'🩳',falda:'👗',vestido:'👗',saco:'🧥',chamarra:'🧥',abrigo:'🧥',sueter:'🧣',zapatos:'👠',tenis:'👟',botas:'👢',sombrero:'🎩',gorra:'🧢',accesorio:'💍',otro:'👗'};

let wd=null,forecastData=null,activeStyle='casual',outfits={},dayOutfits={},dayStyles={},closet=[],pendingImg=null;

function wIcon(c){if(c===1000)return'☀️';if(c===1003)return'⛅';if(c<=1009)return'☁️';if(c<=1135)return'🌫️';if(c<=1201)return'🌧️';if(c<=1225)return'❄️';return'⛈️';}
function wBg(c,d){if(!d)return'linear-gradient(135deg,#1a2a4a,#0d1b33)';if(c===1000)return'linear-gradient(135deg,#e8821e,#c8501a)';if(c<=1006)return'linear-gradient(135deg,#2d6fa8,#1a4a7a)';if(c<=1009)return'linear-gradient(135deg,#5a6070,#3a4050)';if(c>=1063)return'linear-gradient(135deg,#2d3748,#1a202c)';return'linear-gradient(135deg,#1a6fa8,#0d4a7a)';}

function buildAlerts(w){
  const a=[];
  if(w.uv>=8)a.push({i:'🧴',t:`UV muy alto (${w.uv}). Protector solar, sombrero y gafas son esenciales.`});
  else if(w.uv>=6)a.push({i:'☀️',t:`UV elevado (${w.uv}). Usa sombrero y gafas.`});
  if(w.wind_kph>=40)a.push({i:'💨',t:`Vientos de ${Math.round(w.wind_kph)} km/h. Lleva rompevientos.`});
  if(w.precip_mm>=2)a.push({i:'🌧️',t:'Lluvia esperada. No olvides tu paraguas.'});
  else if(w.precip_mm>0)a.push({i:'🌂',t:'Posible llovizna ligera.'});
  if(w.humidity>=85)a.push({i:'💧',t:`Humedad alta (${w.humidity}%). Usa telas transpirables.`});
  if(w.feelslike_c>=35)a.push({i:'🌡️',t:`Sensación de ${Math.round(w.feelslike_c)}°C. ¡Hidrátate bien!`});
  if(w.feelslike_c<=2)a.push({i:'🧤',t:'Frío extremo. Guantes, bufanda y abrigo son esenciales.'});
  return a;
}

function searchBarHTML(ph){
  return`<div class="search-bar">
    <input type="text" id="city-input" placeholder="${ph}" onkeydown="if(event.key==='Enter')buscarCiudad()">
    <button onclick="buscarCiudad()">Buscar</button>
    <button onclick="usarGPS()" title="GPS">📍</button>
  </div>`;
}

async function buscarCiudad(){
  const el=document.getElementById('city-input');
  const val=el?el.value.trim():'';
  if(!val)return;
  renderLoading('Buscando ciudad...');
  try{
    const[curr,fore]=await Promise.all([
      fetch(`/api/weather?q=${encodeURIComponent(val)}`).then(r=>r.json()),
      fetch(`/api/weather?q=${encodeURIComponent(val)}&forecast=1`).then(r=>r.json())
    ]);
    wd=curr;forecastData=fore;outfits={};dayOutfits={};
    renderPage();loadOutfit(activeStyle);
  }catch(e){renderError('Ciudad no encontrada. Intenta con otro nombre.');}
}

async function usarGPS(){
  renderLoading('Detectando tu ubicación...');
  try{
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:10000}));
    renderLoading('Obteniendo el clima...');
    const q=`${pos.coords.latitude},${pos.coords.longitude}`;
    const[curr,fore]=await Promise.all([
      fetch(`/api/weather?q=${q}`).then(r=>r.json()),
      fetch(`/api/weather?q=${q}&forecast=1`).then(r=>r.json())
    ]);
    wd=curr;forecastData=fore;outfits={};dayOutfits={};
    renderPage();loadOutfit(activeStyle);
  }catch(e){renderError('No se pudo usar el GPS. Escribe tu ciudad.');}
}

function renderLoading(msg){
  document.getElementById('app').innerHTML=`<div class="loading-box"><span class="spinner"></span>${msg}</div>`;
}

function renderError(msg){
  document.getElementById('app').innerHTML=searchBarHTML('Ej: Ciudad de México, Monterrey...')+
    `<div style="text-align:center;padding:2rem;color:#e53935;font-size:14px">${msg}</div>`;
}

function renderPage(){
  if(!wd||!forecastData)return;
  const w=wd.current,loc=wd.location;
  const date=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  const alerts=buildAlerts(w);
  const alertsHTML=alerts.map(a=>`<div class="alert"><span class="alert-ico">${a.i}</span><span class="alert-txt">${a.t}</span></div>`).join('');

  // HOURLY
  const now=new Date().getHours();
  const hours=forecastData.forecast.forecastday[0].hour;
  const hoursHTML=hours.map(h=>{
    const hr=new Date(h.time).getHours();
    const isNow=hr===now;
    const rain=h.chance_of_rain>0?`<div class="hour-rain">💧${h.chance_of_rain}%</div>`:'';
    return`<div class="hour-card${isNow?' now':''}">
      <div class="hour-time">${hr===0?'12am':hr<12?hr+'am':hr===12?'12pm':(hr-12)+'pm'}</div>
      <div class="hour-icon">${wIcon(h.condition.code)}</div>
      <div class="hour-temp">${Math.round(h.temp_c)}°</div>
      ${rain}
    </div>`;
  }).join('');

  // PILLS
  const pillsHTML=Object.entries(styleLabels).map(([k,v])=>
    `<button class="pill${k===activeStyle?' active':''}" onclick="switchStyle('${k}')">${v}</button>`
  ).join('');

  // 7 DAYS
  const dayNames=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const daysHTML=forecastData.forecast.forecastday.map((d,i)=>{
    const dt=new Date(d.date);
    const name=i===0?'Hoy':i===1?'Mañana':dayNames[dt.getDay()];
    const rain=d.day.daily_chance_of_rain>0?`<span class="day-rain-badge">💧${d.day.daily_chance_of_rain}%</span>`:'';
    const ds=dayStyles[i]||'casual';
    const dpills=Object.entries(styleLabels).map(([k,v])=>
      `<button class="day-pill${k===ds?' active':''}" onclick="event.stopPropagation();switchDayStyle(${i},'${k}')">${v}</button>`
    ).join('');
    return`<div class="day-card" id="day-${i}" onclick="toggleDay(${i})">
      <div class="day-card-top">
        <div class="day-name">${name}</div>
        <div class="day-icon">${wIcon(d.day.condition.code)}</div>
        <div class="day-cond">${d.day.condition.text}</div>
        ${rain}
        <div class="day-temps"><span class="day-max">${Math.round(d.day.maxtemp_c)}°</span><span class="day-min">${Math.round(d.day.mintemp_c)}°</span></div>
      </div>
      <div class="day-outfit-area" id="day-outfit-${i}">
        <div class="day-style-pills">${dpills}</div>
        <div id="day-outfit-content-${i}"><div class="loading-box"><span class="spinner"></span>Generando outfit...</div></div>
      </div>
    </div>`;
  }).join('');

  // CLOSET SECTION
  const closetSection=renderClosetSection();

  document.getElementById('app').innerHTML=`
    ${searchBarHTML(loc.name)}

    <div class="weather-card" style="background:${wBg(w.condition.code,w.is_day)}">
      <div class="wc-top">
        <div><div class="wc-city">📍 ${loc.name}, ${loc.country}</div><div class="wc-date">${date.charAt(0).toUpperCase()+date.slice(1)}</div></div>
        <div class="wc-icon">${wIcon(w.condition.code)}</div>
      </div>
      <div class="wc-mid"><span class="wc-temp">${Math.round(w.temp_c)}</span><span class="wc-unit">°C</span></div>
      <div class="wc-cond">${w.condition.text}</div>
      <div class="wc-feels">Sensación ${Math.round(w.feelslike_c)}°C</div>
      <div class="wc-stats">
        <div class="wc-stat"><div class="wc-stat-v">💧 ${w.humidity}%</div><div class="wc-stat-l">Humedad</div></div>
        <div class="wc-stat"><div class="wc-stat-v">💨 ${Math.round(w.wind_kph)}</div><div class="wc-stat-l">km/h</div></div>
        <div class="wc-stat"><div class="wc-stat-v">☀️ UV ${w.uv}</div><div class="wc-stat-l">Índice</div></div>
        <div class="wc-stat"><div class="wc-stat-v">👁️ ${Math.round(w.vis_km)}km</div><div class="wc-stat-l">Visib.</div></div>
      </div>
    </div>

    ${alertsHTML}

    <div class="section-label">⏱ Clima por hora</div>
    <div class="hourly-scroll">${hoursHTML}</div>

    <div class="divider"></div>

    <div class="section-label">👗 Outfit de hoy</div>
    <div class="style-pills">${pillsHTML}</div>
    <div id="outfit-area">${renderOutfitSection()}</div>

    <div class="divider"></div>

    <div class="section-label">👔 Mi closet</div>
    ${closetSection}

    <div class="divider"></div>

    <div class="section-label">📅 Próximos 7 días</div>
    <p style="font-size:13px;color:#888;margin-bottom:1rem">Toca un día para ver el outfit sugerido y planear tu semana 👇</p>
    ${daysHTML}
  `;
}

function renderOutfitSection(){
  if(!outfits[activeStyle])return'<div class="loading-box"><span class="spinner"></span>Generando outfit con IA...</div>';
  const o=outfits[activeStyle];
  const itemsHTML=(o.prendas||[]).map(p=>{
    const ci=closet.find(c=>c.id===p.closet_id);
    const thumb=ci&&ci.img?`<img class="oi-thumb" src="${ci.img}">`:`<div class="oi-ph">${p.emoji||'👕'}</div>`;
    return`<div class="outfit-item">${thumb}<div style="flex:1"><div class="oi-name">${p.nombre}</div><div class="oi-why">${p.razon}</div>${ci?'<span class="oi-badge">✓ Tu closet</span>':''}</div></div>`;
  }).join('');
  return`<div class="outfit-card"><div class="outfit-frase">${o.frase}</div><div class="outfit-items">${itemsHTML}</div></div>`;
}

function renderClosetSection(){
  const uploadHTML=`<div class="upload-zone" onclick="document.getElementById('fi').click()">
    <input type="file" id="fi" accept="image/*" multiple onchange="handleFiles(this.files)">
    <div style="font-size:28px;margin-bottom:.4rem">📸</div>
    <div style="font-size:14px;font-weight:600">Agregar prenda</div>
    <div style="font-size:12px;color:#888;margin-top:3px">Toca para subir una foto de tu ropa</div>
  </div>`;
  if(closet.length===0){
    return uploadHTML+`<div class="empty-state"><div class="empty-icon">👗</div><div class="empty-title">Tu closet está vacío</div><div class="empty-sub">Sube fotos de tus prendas y la IA las usará para sugerirte outfits con lo que ya tienes</div></div>`;
  }
  const grid=closet.map(item=>`
    <div class="closet-item">
      ${item.img?`<img class="closet-img" src="${item.img}">`:`<div class="closet-ph">${tipoEmoji[item.tipo]||'👗'}</div>`}
      <div class="closet-info"><div class="closet-name">${item.nombre}</div><div class="closet-type">${item.tipo} · ${item.color}</div></div>
      <button class="closet-del" onclick="deleteItem('${item.id}')">Eliminar</button>
    </div>`).join('');
  return uploadHTML+`<div class="section-label" style="margin-top:.5rem">${closet.length} prenda${closet.length!==1?'s':''}</div><div class="closet-grid">${grid}</div>`;
}

async function switchStyle(s){
  activeStyle=s;
  // update pills
  document.querySelectorAll('.style-pills .pill').forEach(b=>{
    b.className='pill'+(b.textContent===styleLabels[s]?' active':'');
  });
  const area=document.getElementById('outfit-area');
  if(area)area.innerHTML=renderOutfitSection();
  if(!outfits[s])await loadOutfit(s);
}

async function loadOutfit(s){
  if(!wd)return;
  const w=wd.current;
  const closetInfo=closet.length>0
    ?`Prendas del closet:\n${closet.map(c=>`id:${c.id} = ${c.nombre} (${c.tipo}, ${c.color})`).join('\n')}\nUsa las del closet si aplican. Pon id en closet_id.`
    :'Sin closet. closet_id siempre null.';
  const prompt=`Eres un estilista personal. Clima: ${Math.round(w.temp_c)}°C (sensación ${Math.round(w.feelslike_c)}°C), ${w.condition.text}, humedad ${w.humidity}%, viento ${Math.round(w.wind_kph)}km/h, UV ${w.uv}, lluvia ${w.precip_mm}mm. Estilo: ${styleLabels[s]}.\n${closetInfo}\nSIEMPRE sugiere 5 prendas. UV>7=sombrero obligatorio. Viento+sol=rompevientos. Lluvia=impermeable. Calor=telas ligeras.\nResponde SOLO JSON sin backticks:\n{"frase":"frase motivadora","prendas":[{"emoji":"👕","nombre":"prenda","razon":"razón basada en el clima","closet_id":null},{"emoji":"👖","nombre":"...","razon":"...","closet_id":null},{"emoji":"👟","nombre":"...","razon":"...","closet_id":null},{"emoji":"🧢","nombre":"...","razon":"...","closet_id":null},{"emoji":"🕶️","nombre":"...","razon":"...","closet_id":null}]}`;
  try{
    const res=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    const data=await res.json();
    outfits[s]=JSON.parse(data.content.map(i=>i.text||'').join('').replace(/```json|```/g,'').trim());
  }catch(e){outfits[s]={frase:'No se pudo generar el outfit.',prendas:[]};}
  const area=document.getElementById('outfit-area');
  if(area)area.innerHTML=renderOutfitSection();
}

function toggleDay(i){
  const card=document.getElementById(`day-${i}`);
  const area=document.getElementById(`day-outfit-${i}`);
  const isOpen=card.classList.contains('open');
  card.classList.toggle('open');
  if(!isOpen){
    const s=dayStyles[i]||'casual';
    if(!dayOutfits[`${i}-${s}`])loadDayOutfit(i,s);
  }
}

async function switchDayStyle(i,s){
  dayStyles[i]=s;
  document.querySelectorAll(`#day-outfit-${i} .day-pill`).forEach(b=>{
    b.className='day-pill'+(b.textContent===styleLabels[s]?' active':'');
  });
  const content=document.getElementById(`day-outfit-content-${i}`);
  if(content)content.innerHTML='<div class="loading-box"><span class="spinner"></span>Generando outfit...</div>';
  if(!dayOutfits[`${i}-${s}`])await loadDayOutfit(i,s);
  else{if(content)content.innerHTML=renderDayOutfitContent(i,s);}
}

function renderDayOutfitContent(i,s){
  const key=`${i}-${s}`;
  if(!dayOutfits[key])return'<div class="loading-box"><span class="spinner"></span>Generando outfit...</div>';
  const o=dayOutfits[key];
  const itemsHTML=(o.prendas||[]).map(p=>`<div class="outfit-item"><div class="oi-ph">${p.emoji||'👕'}</div><div style="flex:1"><div class="oi-name">${p.nombre}</div><div class="oi-why">${p.razon}</div></div></div>`).join('');
  return`<div class="outfit-card" style="margin-bottom:0"><div class="outfit-frase">${o.frase}</div><div class="outfit-items">${itemsHTML}</div></div>`;
}

async function loadDayOutfit(i,s){
  if(!forecastData)return;
  const d=forecastData.forecast.forecastday[i].day;
  const closetInfo=closet.length>0?`Prendas del closet: ${closet.map(c=>`${c.nombre} (${c.tipo}, ${c.color})`).join(', ')}. Menciónalas si aplican.`:'';
  const prompt=`Eres un estilista personal. Clima del día: máx ${Math.round(d.maxtemp_c)}°C, mín ${Math.round(d.mintemp_c)}°C, ${d.condition.text}, lluvia ${d.daily_chance_of_rain}%, humedad ${d.avghumidity}%, UV ${d.uv}. Estilo: ${styleLabels[s]}. ${closetInfo} Sugiere 5 prendas específicas para este día. Responde SOLO JSON sin backticks: {"frase":"frase motivadora para este día","prendas":[{"emoji":"👕","nombre":"prenda","razon":"razón"},{"emoji":"👖","nombre":"...","razon":"..."},{"emoji":"👟","nombre":"...","razon":"..."},{"emoji":"🧢","nombre":"...","razon":"..."},{"emoji":"🕶️","nombre":"...","razon":"..."}]}`;
  try{
    const res=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:800,messages:[{role:'user',content:prompt}]})});
    const data=await res.json();
    dayOutfits[`${i}-${s}`]=JSON.parse(data.content.map(x=>x.text||'').join('').replace(/```json|```/g,'').trim());
  }catch(e){dayOutfits[`${i}-${s}`]={frase:'No se pudo generar el outfit.',prendas:[]};}
  const content=document.getElementById(`day-outfit-content-${i}`);
  if(content)content.innerHTML=renderDayOutfitContent(i,s);
}

function handleFiles(files){
  Array.from(files).forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{pendingImg=e.target.result;showModal(f.name);};
    r.readAsDataURL(f);
  });
}

function showModal(fn){
  const name=fn.replace(/\.[^.]+$/,'').replace(/[-_]/g,' ');
  document.getElementById('modal-area').innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title">Agregar al closet</div>
        <img class="modal-img" src="${pendingImg}">
        <div class="modal-row full"><input type="text" id="m-n" placeholder="Nombre ej: Camisa azul" value="${name}"></div>
        <div class="modal-row">
          <select id="m-t">${Object.keys(tipoEmoji).map(t=>`<option value="${t}">${tipoEmoji[t]} ${t.charAt(0).toUpperCase()+t.slice(1)}</option>`).join('')}</select>
          <input type="text" id="m-c" placeholder="Color ej: azul marino">
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
          <button class="btn-save" onclick="saveItem()">Guardar prenda</button>
        </div>
      </div>
    </div>`;
}

function closeModal(){document.getElementById('modal-area').innerHTML='';pendingImg=null;}

function saveItem(){
  const id='c'+Date.now();
  closet.push({id,nombre:document.getElementById('m-n').value.trim()||'Prenda',tipo:document.getElementById('m-t').value,color:document.getElementById('m-c').value.trim()||'sin color',img:pendingImg});
  outfits={};closeModal();renderPage();loadOutfit(activeStyle);
}

function deleteItem(id){
  closet=closet.filter(c=>c.id!==id);
  outfits={};renderPage();loadOutfit(activeStyle);
}

// INIT
(async function init(){
  try{
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:6000}));
    renderLoading('Obteniendo el clima...');
    const q=`${pos.coords.latitude},${pos.coords.longitude}`;
    const[curr,fore]=await Promise.all([
      fetch(`/api/weather?q=${q}`).then(r=>r.json()),
      fetch(`/api/weather?q=${q}&forecast=1`).then(r=>r.json())
    ]);
    wd=curr;forecastData=fore;
    renderPage();loadOutfit(activeStyle);
  }catch(e){
    document.getElementById('app').innerHTML=searchBarHTML('Ej: Ciudad de México, Monterrey...')+
      `<div style="text-align:center;padding:2rem;color:#888;font-size:14px">Escribe tu ciudad o toca 📍 para usar tu ubicación</div>`;
  }
})();
</script>
